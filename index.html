<!-- 💳 ՎՃԱՐՄԱՆ ԲԱԺԻՆ -->
<section class="payment-section">

    <h2>💳 Ընտրիր վճարման եղանակը</h2>
    <p class="payment-subtitle">Անվտանգ և հարմար վճարում 🛒✨</p>

    <div class="bank-cards">

        <button class="bank-card" onclick="selectBank('IDBank')">
            <div class="bank-icon">💳</div>
            <div>
                <strong>IDBank</strong>
                <span>Վճարել քարտով</span>
            </div>
        </button>

        <button class="bank-card" onclick="selectBank('Ameriabank')">
            <div class="bank-icon">💳</div>
            <div>
                <strong>Ameriabank</strong>
                <span>Վճարել քարտով</span>
            </div>
        </button>

        <button class="bank-card" onclick="selectBank('ACBA')">
            <div class="bank-icon">💳</div>
            <div>
                <strong>ACBA</strong>
                <span>Վճարել քարտով</span>
            </div>
        </button>

        <button class="bank-card" onclick="selectBank('Ardshinbank')">
            <div class="bank-icon">💳</div>
            <div>
                <strong>Ardshinbank</strong>
                <span>Վճարել քարտով</span>
            </div>
        </button>

    </div>

    <div id="selectedBank" class="selected-bank">
        👆 Ընտրիր բանկը
    </div>

</section>

<style>
.payment-section{
    margin:40px auto;
    max-width:700px;
    padding:28px 20px;
    border-radius:28px;
    background:rgba(0,0,0,.65);
    border:2px solid rgba(255,255,255,.2);
    box-shadow:
        0 0 20px rgba(0,255,255,.25),
        0 0 50px rgba(255,0,255,.15);
    text-align:center;
}

.payment-section h2{
    margin:0;
    color:white;
    font-size:28px;
    text-shadow:
        0 0 8px #00ffff,
        0 0 18px #ff00ff;
}

.payment-subtitle{
    color:#ddd;
    margin:10px 0 25px;
}

.bank-cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.bank-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:20px;
    background:linear-gradient(
        135deg,
        rgba(0,255,255,.12),
        rgba(255,0,255,.12)
    );
    color:white;
    cursor:pointer;
    transition:.3s;
    text-align:left;
}

.bank-card:hover{
    transform:translateY(-5px) scale(1.02);
    border-color:#00ffff;
    box-shadow:
        0 0 15px #00ffff,
        0 0 30px rgba(255,0,255,.4);
}

.bank-icon{
    font-size:35px;
}

.bank-card strong{
    display:block;
    font-size:18px;
}

.bank-card span{
    display:block;
    color:#bbb;
    font-size:13px;
    margin-top:4px;
}

.selected-bank{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    color:#00ffff;
    background:rgba(0,255,255,.08);
    font-weight:bold;
}

@media(max-width:600px){
    .bank-cards{
        grid-template-columns:1fr;
    }

    .payment-section h2{
        font-size:23px;
    }
}
</style>

<script>
function selectBank(bank){

    document.getElementById("selectedBank").innerHTML =
        "✅ Ընտրված է՝ <strong>" + bank + "</strong>";

    // Այստեղ հետո կարող ենք դնել տվյալ բանկի
    // իրական վճարման հղումը/API-ն։
}
</script>
