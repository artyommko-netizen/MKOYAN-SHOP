<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 MKOYAN SHOP 🔥</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+Armenian:wght@400;700;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Noto Sans Armenian',Arial,sans-serif;
    color:white;
    min-height:100vh;
    overflow-x:hidden;

    background:
        linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.78)),
        url("file_00000000799081f4a645b2fa3c325f48.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* 🌟 Փայլող կետեր */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;

    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 2px),
        radial-gradient(circle,rgba(0,238,255,.7) 1px,transparent 2px);

    background-size:70px 70px,110px 110px;
    animation:stars 7s linear infinite;
}

@keyframes stars{
    from{background-position:0 0,0 0;}
    to{background-position:140px 140px,-180px 100px;}
}

/* HEADER */

header{
    text-align:center;
    padding:35px 15px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.3);
}

.logo{
    font-family:Orbitron,sans-serif;
    font-size:clamp(40px,10vw,75px);
    font-weight:900;
    letter-spacing:5px;

    animation:logo 1.8s infinite alternate;
}

@keyframes logo{
    from{
        text-shadow:
        0 0 5px white,
        0 0 15px #7c3aed,
        0 0 30px #7c3aed;
    }

    to{
        text-shadow:
        0 0 15px white,
        0 0 35px #00eaff,
        0 0 65px #ff00ff;
    }
}

.subtitle{
    margin-top:12px;
    color:#eee;
    font-size:17px;
}

/* YOUTUBE */

.youtube{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    margin-top:20px;
    padding:13px 25px;

    color:white;
    text-decoration:none;
    font-family:Orbitron,sans-serif;
    font-weight:900;

    border-radius:40px;

    background:linear-gradient(
        90deg,
        red,
        #ff0080,
        red
    );

    background-size:300% 100%;

    animation:
        youtube 2s linear infinite,
        youtubeButton 1.5s infinite;

    box-shadow:
        0 0 15px red,
        0 0 40px rgba(255,0,0,.7);
}

.yt-icon{
    display:inline-block;
    color:white;
    font-size:28px;

    animation:youtubeIcon .7s infinite alternate;

    text-shadow:
        0 0 8px white,
        0 0 18px red,
        0 0 30px red;
}

@keyframes youtube{
    0%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

    100%{
        background-position:200%;
    }
}

@keyframes youtubeButton{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-5px) scale(1.04);
    }
}

@keyframes youtubeIcon{
    0%{
        transform:scale(1) rotate(-8deg);
    }

    50%{
        transform:scale(1.25) rotate(8deg);
    }

    100%{
        transform:scale(.9) rotate(-5deg);
    }
}

/* NAV */

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    padding:18px;

    background:rgba(0,0,0,.55);
    backdrop-filter:blur(10px);
}

nav a{
    color:white;
    text-decoration:none;

    padding:10px 20px;
    border-radius:30px;

    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3);

    transition:.3s;
}

nav a:hover{
    transform:translateY(-5px) scale(1.08);
    box-shadow:0 0 25px #00eaff;
}

/* FLOATING EMOJI */

.floating{
    position:fixed;
    bottom:-60px;
    font-size:28px;
    pointer-events:none;
    z-index:20;

    animation:fly 7s linear infinite;
}

@keyframes fly{
    0%{
        transform:translateY(0) rotate(0deg) scale(.7);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:translateY(-115vh) rotate(500deg) scale(1.5);
        opacity:0;
    }
}

/* MAIN */

.container{
    width:min(1100px,92%);
    margin:auto;
    padding:45px 0;
}

.welcome{
    text-align:center;
    margin-bottom:45px;
}

.welcome h2{
    font-size:clamp(25px,6vw,45px);

    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
    from{
        text-shadow:0 0 10px white,0 0 25px #8b5cf6;
    }

    to{
        text-shadow:0 0 20px white,0 0 45px #00eaff;
    }
}

.welcome p{
    margin-top:15px;
    color:#ddd;
}

/* SECTION */

.section-title{
    text-align:center;
    margin:55px 0 25px;
}

.section-title h2{
    font-family:Orbitron,sans-serif;
    font-size:32px;

    text-shadow:
        0 0 10px white,
        0 0 30px #8b5cf6;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:22px;
}

.card{
    position:relative;
    text-align:center;

    padding:28px 20px;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.3);
    border-radius:25px;

    overflow:hidden;

    box-shadow:0 15px 35px rgba(0,0,0,.6);

    transition:.4s;
}

.card:hover{
    transform:translateY(-12px) scale(1.03);

    box-shadow:
        0 0 25px #8b5cf6,
        0 0 55px rgba(0,234,255,.35);
}

.card::before{
    content:"✨ 💎 ✨";
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;

    animation:sideEmoji 2s infinite alternate;
}

@keyframes sideEmoji{
    from{
        letter-spacing:2px;
        opacity:.5;
    }

    to{
        letter-spacing:12px;
        opacity:1;
    }
}

.card::after{
    content:"🔥";
    position:absolute;
    right:10px;
    bottom:8px;
    font-size:30px;

    animation:fire 1s infinite alternate;
}

@keyframes fire{
    to{
        transform:scale(1.35) rotate(10deg);
        filter:drop-shadow(0 0 12px orange);
    }
}

.icon{
    margin-top:15px;
    font-size:58px;

    animation:iconMove 1.5s infinite alternate;

    filter:drop-shadow(0 0 15px white);
}

@keyframes iconMove{
    to{
        transform:translateY(-10px) rotate(5deg) scale(1.08);
    }
}

.card h3{
    margin:10px 0;
    font-size:22px;
}

.description{
    color:#ccc;
    min-height:42px;
}

/* PRICE */

.price{
    position:relative;
    display:inline-block;

    margin:20px 0;

    font-family:Orbitron,sans-serif;
    font-size:27px;
    font-weight:900;

    color:#fff;

    animation:price 1.3s infinite alternate;

    text-shadow:
        0 0 10px #00eaff,
        0 0 25px #8b5cf6;
}

.price::before{
    content:"💰";
    position:absolute;
    right:100%;
    margin-right:8px;

    animation:moneyLeft 1s infinite alternate;
}

.price::after{
    content:"✨";
    position:absolute;
    left:100%;
    margin-left:8px;

    animation:moneyRight 1s infinite alternate;
}

@keyframes price{
    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.12);
    }
}

@keyframes moneyLeft{
    from{
        transform:translateX(0) rotate(-15deg);
    }

    to{
        transform:translateX(-8px) rotate(15deg);
    }
}

@keyframes moneyRight{
    from{
        transform:translateX(0) rotate(15deg);
    }

    to{
        transform:translateX(8px) rotate(-15deg);
    }
}

/* BUY */

.buy{
    display:inline-block;

    padding:14px 30px;

    color:white;
    text-decoration:none;
    font-weight:900;

    border-radius:35px;

    border:0;
    cursor:pointer;

    font-size:16px;

    background:linear-gradient(
        135deg,
        #7c3aed,
        #2563eb,
        #00eaff
    );

    background-size:200% 200%;

    animation:buyGlow 2s infinite;

    box-shadow:0 0 20px rgba(0,234,255,.6);

    transition:.25s;
}

@keyframes buyGlow{
    50%{
        background-position:100% 100%;

        box-shadow:
            0 0 35px #00eaff,
            0 0 60
